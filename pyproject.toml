[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aerograph"
version = "0.1.0"
description = "GraphRAG over aviation safety incident reports for causal reasoning and safety pattern extraction"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Aryan Dhawan"}]
dependencies = [
    "anthropic>=0.39.0",
    "chromadb>=0.4.22",
    "neo4j>=5.15.0",
    "networkx>=3.2",
    "sentence-transformers>=2.3.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.25.0",
    "tenacity>=8.2.0",
    "httpx>=0.26.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "huggingface-hub>=0.20.0",
    "datasets>=2.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
